name: release-please

on:
  push:
    branches:
      - main

concurrency: release-please

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # image.yml is a reusable-workflow call, so it cannot run a step of its
      # own. Compute its tags here, from the major and minor that the
      # release step also outputs.
      - id: tags
        if: steps.release.outputs.release_created == 'true'
        run: |
          {
            echo "tags<<TAGS_EOF"
            echo "${{ steps.release.outputs.version }}"
            echo "${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}"
            echo "latest"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

  image:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      push: true
      version: ${{ needs.release.outputs.version }}
      tags: ${{ needs.release.outputs.tags }}

  chart:
    needs: [release, image]
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          version="${{ needs.release.outputs.version }}"
          chart_version="$(yq '.version' charts/rancher-namespace-filter/Chart.yaml)"
          if [ "$chart_version" != "$version" ]; then
            echo "chart version $chart_version does not match release version $version" >&2
            exit 1
          fi
          helm package charts/rancher-namespace-filter --destination dist
          helm push "dist/rancher-namespace-filter-${version}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
