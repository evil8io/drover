name: ci

on:
  pull_request:
  push:
    branches:
      - main

# A run on main waits for the previous run, so the last push sets the main image tag.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.image-vars.outputs.version }}
      tags: ${{ steps.image-vars.outputs.tags }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: test -z "$(gofmt -l .)"

      - run: go vet ./...

      - run: go test -race -count=1 ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      # image.yml is a reusable-workflow call, so it cannot run a step of its
      # own. Compute its version and tags here instead.
      - id: image-vars
        run: |
          sha_short="${GITHUB_SHA:0:7}"
          if [ "${{ github.event_name }}" = "push" ]; then
            version="main-$sha_short"
            tags=$'main\nsha-'"$sha_short"
          else
            version="pr-${{ github.event.pull_request.number }}"
            tags="pr-${{ github.event.pull_request.number }}"
          fi
          {
            echo "version=$version"
            echo "tags<<TAGS_EOF"
            echo "$tags"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v1.1.2 --verify=false

      - run: helm lint --strict charts/rancher-namespace-filter -f charts/rancher-namespace-filter/ci/default-values.yaml

      - run: helm lint --strict charts/rancher-namespace-filter -f charts/rancher-namespace-filter/ci/existing-secret-values.yaml

      - run: helm lint --strict charts/rancher-namespace-filter -f charts/rancher-namespace-filter/ci/httproute-values.yaml

      - run: helm unittest charts/rancher-namespace-filter

      # The schema requires upstream.url, so a template render without values must fail.
      - run: '! helm template charts/rancher-namespace-filter'

      - run: helm template rnf charts/rancher-namespace-filter -f charts/rancher-namespace-filter/ci/httproute-values.yaml | go run github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0 -strict -summary -kubernetes-version 1.33.0 -schema-location default -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

  image:
    needs: [go, chart]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      push: ${{ github.event_name == 'push' }}
      version: ${{ needs.go.outputs.version }}
      tags: ${{ needs.go.outputs.tags }}
