name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A run on main waits for the previous run, so the last push sets the main image tag.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.image-vars.outputs.version }}
      tags: ${{ steps.image-vars.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - run: go mod verify

      - run: test -z "$(gofmt -l .)"

      - run: go vet ./...

      - run: go test -race -count=1 ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.13.2

      # image.yml is a reusable-workflow call, so it cannot run a step of its
      # own. Compute its version and tags here instead.
      - id: image-vars
        run: |
          sha_short="${GITHUB_SHA:0:7}"
          if [ "${{ github.event_name }}" = "push" ]; then
            version="main-$sha_short"
            tags=$'main\nsha-'"$sha_short"
          else
            version="pr-${{ github.event.pull_request.number }}"
            tags="pr-${{ github.event.pull_request.number }}"
          fi
          {
            echo "version=$version"
            echo "tags<<TAGS_EOF"
            echo "$tags"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

  image:
    needs: [go]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      push: ${{ github.event_name == 'push' }}
      version: ${{ needs.go.outputs.version }}
      tags: ${{ needs.go.outputs.tags }}
