{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "rancher-namespace-filter.fullname" . }}
  labels:
    {{- include "rancher-namespace-filter.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "rancher-namespace-filter.selectorLabels" . | nindent 6 }}
{{- end }}
