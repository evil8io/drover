suite: service account
templates:
  - templates/serviceaccount.yaml
  - templates/deployment.yaml
release:
  name: rnf
set:
  upstream.url: http://rancher.cattle-system.svc
  token.value: api-token
tests:
  - it: creates a service account without an automount
    asserts:
      - template: templates/serviceaccount.yaml
        equal:
          path: metadata.name
          value: rnf-rancher-namespace-filter
      - template: templates/serviceaccount.yaml
        equal:
          path: automountServiceAccountToken
          value: false
      - template: templates/deployment.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: rnf-rancher-namespace-filter

  - it: uses an existing service account
    set:
      serviceAccount.create: false
      serviceAccount.name: rancher-filter
    asserts:
      - template: templates/serviceaccount.yaml
        hasDocuments:
          count: 0
      - template: templates/deployment.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: rancher-filter
