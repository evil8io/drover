suite: http route
templates:
  - templates/httproute.yaml
release:
  name: rnf
set:
  upstream.url: http://rancher.cattle-system.svc
  token.value: api-token
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders two matches per cluster id
    values:
      - ../ci/httproute-values.yaml
    asserts:
      - isKind:
          of: HTTPRoute
      - isAPIVersion:
          of: gateway.networking.k8s.io/v1
      - equal:
          path: spec.parentRefs
          value:
            - name: rancher
              namespace: gateway
      - equal:
          path: spec.hostnames
          value:
            - rancher.example.com
      - lengthEqual:
          path: spec.rules
          count: 1
      - lengthEqual:
          path: spec.rules[0].matches
          count: 4
      - equal:
          path: spec.rules[0].matches
          value:
            - path:
                type: Exact
                value: /k8s/clusters/c-m-abcde12345/api/v1/namespaces
              method: GET
            - path:
                type: Exact
                value: /k8s/clusters/c-m-abcde12345/apis/authorization.k8s.io/v1/selfsubjectaccessreviews
              method: POST
            - path:
                type: Exact
                value: /k8s/clusters/local/api/v1/namespaces
              method: GET
            - path:
                type: Exact
                value: /k8s/clusters/local/apis/authorization.k8s.io/v1/selfsubjectaccessreviews
              method: POST
      - equal:
          path: spec.rules[0].backendRefs
          value:
            - name: rnf-rancher-namespace-filter
              port: 8080
