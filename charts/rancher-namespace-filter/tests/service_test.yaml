suite: service
templates:
  - templates/service.yaml
release:
  name: rnf
set:
  upstream.url: http://rancher.cattle-system.svc
  token.value: api-token
tests:
  - it: exposes port 8080 on the http target port
    asserts:
      - equal:
          path: metadata.name
          value: rnf-rancher-namespace-filter
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports
          value:
            - name: http
              port: 8080
              targetPort: http
              protocol: TCP
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: rancher-namespace-filter
            app.kubernetes.io/instance: rnf
